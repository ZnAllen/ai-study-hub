<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Hub — 學習任務與知識管理面板</title>
    <!-- FontAwesome 圖示 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --card-bg: #1e293b;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --accent: #c084fc;
            --success: #4ade80;
            --warning: #f59e0b;
            --danger: #f43f5e;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        /* 側邊導覽列 Layout */
        sidebar {
            width: 250px;
            background: rgba(15, 23, 42, 0.95);
            border-right: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: fixed;
            height: 100vh;
            z-index: 100;
            transition: all 0.3s;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 30px;
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-item {
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-sub);
            transition: all 0.2s;
            font-weight: 500;
        }

        .nav-item:hover, .nav-item.active {
            background: var(--primary-hover);
            color: #fff;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2);
        }

        /* 主要內容區 */
        main {
            margin-left: 250px;
            flex: 1;
            padding: 30px;
            max-width: 1200px;
            width: calc(100% - 250px);
        }

        .view-section {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .view-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 頂部標題 */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .page-header h1 {
            font-size: 1.8rem;
            color: var(--text-main);
        }

        /* 卡牌格線 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            background: rgba(56, 189, 248, 0.1);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .stat-info h3 {
            font-size: 1.5rem;
            color: var(--text-main);
        }

        .stat-info p {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        /* 通用按鈕風格 */
        .btn {
            background: var(--primary);
            color: #0f172a;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn:hover {
            background: var(--primary-hover);
            color: #fff;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
        }

        .btn-danger:hover {
            background: #be123c;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* 表單區域 */
        .form-card {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        input, select, textarea {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 6px;
            outline: none;
            font-size: 0.95rem;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
        }

        /* 篩選工具列 */
        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        /* 列表樣式 */
        .data-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .data-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            transition: all 0.2s;
        }

        .data-item.overdue {
            border-left: 4px solid var(--danger);
        }

        .data-item.completed {
            opacity: 0.6;
        }

        .item-main {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
        }

        .checkbox {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .badge-high { background: rgba(244, 63, 94, 0.2); color: var(--danger); }
        .badge-med { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        .badge-low { background: rgba(74, 222, 128, 0.2); color: var(--success); }

        .item-actions {
            display: flex;
            gap: 8px;
        }

        /* 筆記 Grid */
        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .note-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 200px;
        }

        .note-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .note-content {
            font-size: 0.9rem;
            color: var(--text-sub);
            white-space: pre-wrap;
            margin-bottom: 15px;
            flex: 1;
        }

        .note-tags {
            font-size: 0.75rem;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-sub);
            background: var(--panel-bg);
            border-radius: 12px;
            border: 1px dashed var(--border);
        }

        /* 進度條 */
        .progress-bar-container {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            width: 0%;
            transition: width 0.4s ease;
        }

        /* RWD 響應式調整 */
        @media (max-width: 768px) {
            sidebar {
                width: 100%;
                height: auto;
                position: relative;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }

            main {
                margin-left: 0;
                width: 100%;
                padding: 15px;
            }

            body {
                flex-direction: column;
            }

            .data-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .item-actions {
                width: 100%;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>

    <!-- 側邊導覽列 -->
    <sidebar>
        <div>
            <div class="brand">
                <i class="fa-solid fa-brain"></i> AI Study Hub
            </div>
            <ul class="nav-links">
                <li class="nav-item active" onclick="switchView('dashboard')"><i class="fa-solid fa-chart-pie"></i> 學習總覽</li>
                <li class="nav-item" onclick="switchView('tasks')"><i class="fa-solid fa-list-check"></i> 任務管理</li>
                <li class="nav-item" onclick="switchView('notes')"><i class="fa-solid fa-book-bookmark"></i> 知識筆記</li>
                <li class="nav-item" onclick="switchView('stats')"><i class="fa-solid fa-chart-column"></i> 學習統計</li>
            </ul>
        </div>
        <button class="btn btn-secondary" onclick="confirmResetData()" style="width: 100%; justify-content: center; margin-top: 20px;">
            <i class="fa-solid fa-rotate-left"></i> 重設範例資料
        </button>
    </sidebar>

    <!-- 主要內容區 -->
    <main>
        <!-- 1. 學習總覽區 -->
        <section id="dashboard-view" class="view-section active">
            <div class="page-header">
                <h1>學習總覽</h1>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon"><i class="fa-solid fa-tasks"></i></div>
                    <div class="stat-info">
                        <h3 id="stat-total-tasks">0</h3>
                        <p>任務總數</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="color: var(--warning);"><i class="fa-solid fa-clock"></i></div>
                    <div class="stat-info">
                        <h3 id="stat-pending-tasks">0</h3>
                        <p>待完成任務</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="color: var(--success);"><i class="fa-solid fa-check-circle"></i></div>
                    <div class="stat-info">
                        <h3 id="stat-completed-tasks">0</h3>
                        <p>已完成任務</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="color: var(--accent);"><i class="fa-solid fa-percent"></i></div>
                    <div class="stat-info">
                        <h3 id="stat-rate">0%</h3>
                        <p>整體完成率</p>
                    </div>
                </div>
            </div>

            <h2 style="margin-bottom: 15px; color: var(--primary);">即時提醒</h2>
            <div id="dashboard-reminders" class="data-list"></div>
        </section>

        <!-- 2. 任務管理區 -->
        <section id="tasks-view" class="view-section">
            <div class="page-header">
                <h1>任務管理</h1>
                <button class="btn" onclick="toggleTaskForm()"><i class="fa-solid fa-plus"></i> 新增任務</button>
            </div>

            <!-- 任務表單 -->
            <div class="form-card" id="task-form-card" style="display: none;">
                <h3 id="task-form-title" style="margin-bottom: 15px; color: var(--primary);">新增學習任務</h3>
                <input type="hidden" id="task-edit-id">
                <div class="form-grid">
                    <div class="form-group">
                        <label>任務名稱 *</label>
                        <input type="text" id="task-name" placeholder="請輸入任務名稱">
                    </div>
                    <div class="form-group">
                        <label>所屬科目</label>
                        <input type="text" id="task-subject" placeholder="例如：微積分、英文">
                    </div>
                    <div class="form-group">
                        <label>截止日期</label>
                        <input type="date" id="task-dueDate">
                    </div>
                    <div class="form-group">
                        <label>優先級</label>
                        <select id="task-priority">
                            <option value="高">高</option>
                            <option value="中" selected>中</option>
                            <option value="低">低</option>
                        </select>
                    </div>
                </div>
                <div class="form-group" style="margin-bottom: 15px;">
                    <label>備註內容</label>
                    <textarea id="task-notes" rows="2" placeholder="選填補充備註..."></textarea>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn" onclick="saveTask()">儲存任務</button>
                    <button class="btn btn-secondary" onclick="toggleTaskForm()">取消</button>
                </div>
            </div>

            <!-- 篩選列 -->
            <div class="filter-bar">
                <select id="filter-subject" onchange="renderTasks()">
                    <option value="">全部科目</option>
                </select>
                <select id="filter-status" onchange="renderTasks()">
                    <option value="">全部狀態</option>
                    <option value="pending">待完成</option>
                    <option value="completed">已完成</option>
                    <option value="overdue">已逾期</option>
                </select>
                <select id="filter-priority" onchange="renderTasks()">
                    <option value="">全部優先級</option>
                    <option value="高">高</option>
                    <option value="中">中</option>
                    <option value="低">低</option>
                </select>
            </div>

            <!-- 任務列表 -->
            <div id="tasks-list" class="data-list"></div>
        </section>

        <!-- 3. 知識筆記區 -->
        <section id="notes-view" class="view-section">
            <div class="page-header">
                <h1>知識筆記</h1>
                <button class="btn" onclick="toggleNoteForm()"><i class="fa-solid fa-plus"></i> 新增筆記</button>
            </div>

            <!-- 筆記表單 -->
            <div class="form-card" id="note-form-card" style="display: none;">
                <h3 id="note-form-title" style="margin-bottom: 15px; color: var(--primary);">新增筆記</h3>
                <input type="hidden" id="note-edit-id">
                <div class="form-grid">
                    <div class="form-group">
                        <label>筆記標題 *</label>
                        <input type="text" id="note-title" placeholder="請輸入標題">
                    </div>
                    <div class="form-group">
                        <label>所屬科目</label>
                        <input type="text" id="note-subject" placeholder="例如：物理">
                    </div>
                    <div class="form-group">
                        <label>標籤 (以逗點分隔)</label>
                        <input type="text" id="note-tags" placeholder="例如：公式, 期中考">
                    </div>
                </div>
                <div class="form-group" style="margin-bottom: 15px;">
                    <label>筆記內容 *</label>
                    <textarea id="note-content" rows="4" placeholder="詳細內容重點..."></textarea>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn" onclick="saveNote()">儲存筆記</button>
                    <button class="btn btn-secondary" onclick="toggleNoteForm()">取消</button>
                </div>
            </div>

            <!-- 搜尋列 -->
            <div class="filter-bar">
                <input type="text" id="note-search" placeholder="關鍵字搜尋標題、標籤或內容..." oninput="renderNotes()" style="flex: 1;">
            </div>

            <!-- 筆記列表 Grid -->
            <div id="notes-list" class="notes-grid"></div>
        </section>

        <!-- 4. 學習統計區 -->
        <section id="stats-view" class="view-section">
            <div class="page-header">
                <h1>學習統計分析</h1>
            </div>

            <div class="form-card">
                <h3 style="margin-bottom: 10px;">整體學習完成率</h3>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="overall-progress"></div>
                </div>
                <p id="overall-progress-text" style="color: var(--text-sub); font-size: 0.9rem;">完成率 0%</p>
            </div>

            <div class="form-card">
                <h3 style="margin-bottom: 15px;">各科目任務分布</h3>
                <div id="subject-distribution" class="data-list"></div>
            </div>
        </section>
    </main>

    <script>
        // --- 預設範例資料 ---
        const sampleTasks = [
            { id: '1', name: '完成微積分作業 5', subject: '微積分', dueDate: '2026-10-25', priority: '高', completed: false, notes: '第 3 題需再複習積分定理' },
            { id: '2', name: '英文期中口頭報告簡報', subject: '英文', dueDate: '2026-10-18', priority: '中', completed: true, notes: '已上傳 PDF' },
            { id: '3', name: '物理實驗預習報告', subject: '物理', dueDate: '2026-10-15', priority: '高', completed: false, notes: '需計算誤差範圍' }
        ];

        const sampleNotes = [
            { id: '1', title: '微積分 — 導數公式整理', subject: '微積分', tags: '公式, 考試重點', content: 'd/dx (x^n) = n*x^(n-1)\nd/dx (sin x) = cos x\n連鎖律公式需多加練習！', createdAt: '2026-10-10' },
            { id: '2', title: '物理 — 牛頓運動定律', subject: '物理', tags: '基礎觀念', content: '第一定律：慣性定律\n第二定律：F = ma\n第三定律：作用力與反作用力', createdAt: '2026-10-12' }
        ];

        // --- 全域資料狀態 ---
        let tasks = JSON.parse(localStorage.getItem('ai_study_tasks')) || sampleTasks;
        let notes = JSON.parse(localStorage.getItem('ai_study_notes')) || sampleNotes;

        // 保存至 LocalStorage
        function saveData() {
            localStorage.setItem('ai_study_tasks', JSON.stringify(tasks));
            localStorage.setItem('ai_study_notes', JSON.stringify(notes));
            updateDashboard();
            updateSubjectFilters();
        }

        // --- 視圖切換邏輯 ---
        function switchView(viewName) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            document.getElementById(`${viewName}-view`).classList.add('active');
            event.currentTarget.classList.add('active');

            if (viewName === 'tasks') renderTasks();
            if (viewName === 'notes') renderNotes();
            if (viewName === 'stats') renderStats();
            if (viewName === 'dashboard') updateDashboard();
        }

        // --- 總覽與統計邏輯 ---
        function updateDashboard() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const pending = total - completed;
            const rate = total > 0 ? Math.round((completed / total) * 100) : 0;

            document.getElementById('stat-total-tasks').innerText = total;
            document.getElementById('stat-pending-tasks').innerText = pending;
            document.getElementById('stat-completed-tasks').innerText = completed;
            document.getElementById('stat-rate').innerText = `${rate}%`;

            // 即時提醒：顯示逾期或今日任務
            const reminderEl = document.getElementById('dashboard-reminders');
            reminderEl.innerHTML = '';
            const today = new Date().toISOString().split('T')[0];
            const urgentTasks = tasks.filter(t => !t.completed && t.dueDate && t.dueDate <= today);

            if (urgentTasks.length === 0) {
                reminderEl.innerHTML = '<div class="empty-state">目前無急迫或逾期任務，保持得很好！</div>';
            } else {
                urgentTasks.forEach(t => {
                    const isOverdue = t.dueDate < today;
                    reminderEl.innerHTML += `
                        <div class="data-item ${isOverdue ? 'overdue' : ''}">
                            <div class="item-main">
                                <strong>[${t.subject || '一般'}] ${t.name}</strong>
                                <span class="badge badge-high">${isOverdue ? '已逾期' : '今日到期'}</span>
                            </div>
                            <span style="color: var(--text-sub); font-size: 0.85rem;">截止日期：${t.dueDate}</span>
                        </div>
                    `;
                });
            }
        }

        // --- 任務管理 CRUD & 篩選 ---
        function toggleTaskForm() {
            const card = document.getElementById('task-form-card');
            card.style.display = card.style.display === 'none' ? 'block' : 'none';
            if (card.style.display === 'none') resetTaskForm();
        }

        function resetTaskForm() {
            document.getElementById('task-edit-id').value = '';
            document.getElementById('task-name').value = '';
            document.getElementById('task-subject').value = '';
            document.getElementById('task-dueDate').value = '';
            document.getElementById('task-priority').value = '中';
            document.getElementById('task-notes').value = '';
            document.getElementById('task-form-title').innerText = '新增學習任務';
        }

        function saveTask() {
            const name = document.getElementById('task-name').value.trim();
            if (!name) { alert('請輸入任務名稱！'); return; }

            const id = document.getElementById('task-edit-id').value;
            const taskData = {
                id: id || Date.now().toString(),
                name: name,
                subject: document.getElementById('task-subject').value.trim(),
                dueDate: document.getElementById('task-dueDate').value,
                priority: document.getElementById('task-priority').value,
                notes: document.getElementById('task-notes').value.trim(),
                completed: false
            };

            if (id) {
                const idx = tasks.findIndex(t => t.id === id);
                taskData.completed = tasks[idx].completed;
                tasks[idx] = taskData;
            } else {
                tasks.push(taskData);
            }

            saveData();
            toggleTaskForm();
            renderTasks();
        }

        function toggleTaskStatus(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveData();
                renderTasks();
            }
        }

        function editTask(id) {
            const t = tasks.find(t => t.id === id);
            if (!t) return;
            document.getElementById('task-edit-id').value = t.id;
            document.getElementById('task-name').value = t.name;
            document.getElementById('task-subject').value = t.subject;
            document.getElementById('task-dueDate').value = t.dueDate;
            document.getElementById('task-priority').value = t.priority;
            document.getElementById('task-notes').value = t.notes;
            document.getElementById('task-form-title').innerText = '編輯學習任務';
            document.getElementById('task-form-card').style.display = 'block';
        }

        function deleteTask(id) {
            if (confirm('確定要刪除這項任務嗎？')) {
                tasks = tasks.filter(t => t.id !== id);
                saveData();
                renderTasks();
            }
        }

        function renderTasks() {
            const subject = document.getElementById('filter-subject').value;
            const status = document.getElementById('filter-status').value;
            const priority = document.getElementById('filter-priority').value;
            const today = new Date().toISOString().split('T')[0];

            let filtered = tasks.filter(t => {
                if (subject && t.subject !== subject) return false;
                if (priority && t.priority !== priority) return false;
                if (status === 'completed' && !t.completed) return false;
                if (status === 'pending' && t.completed) return false;
                if (status === 'overdue' && (t.completed || !t.dueDate || t.dueDate >= today)) return false;
                return true;
            });

            const listEl = document.getElementById('tasks-list');
            listEl.innerHTML = '';

            if (filtered.length === 0) {
                listEl.innerHTML = '<div class="empty-state">尚無符合條件的任務</div>';
                return;
            }

            filtered.forEach(t => {
                const isOverdue = !t.completed && t.dueDate && t.dueDate < today;
                const badgeClass = t.priority === '高' ? 'badge-high' : (t.priority === '中' ? 'badge-med' : 'badge-low');

                listEl.innerHTML += `
                    <div class="data-item ${isOverdue ? 'overdue' : ''} ${t.completed ? 'completed' : ''}">
                        <div class="item-main">
                            <input type="checkbox" class="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTaskStatus('${t.id}')">
                            <div>
                                <strong>[${t.subject || '一般'}] ${t.name}</strong>
                                <span class="badge ${badgeClass}">${t.priority}優先級</span>
                                ${isOverdue ? '<span class="badge badge-high">已逾期</span>' : ''}
                                ${t.notes ? `<p style="font-size: 0.85rem; color: var(--text-sub); margin-top: 4px;">${t.notes}</p>` : ''}
                            </div>
                        </div>
                        <div class="item-actions">
                            <span style="font-size: 0.85rem; color: var(--text-sub); align-self: center;">${t.dueDate || '無截止日'}</span>
                            <button class="btn btn-secondary" onclick="editTask('${t.id}')"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn btn-danger" onclick="deleteTask('${t.id}')"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });
        }

        function updateSubjectFilters() {
            const subjects = [...new Set(tasks.map(t => t.subject).filter(Boolean))];
            const select = document.getElementById('filter-subject');
            select.innerHTML = '<option value="">全部科目</option>';
            subjects.forEach(s => {
                select.innerHTML += `<option value="${s}">${s}</option>`;
            });
        }

        // --- 知識筆記 CRUD & 搜尋 ---
        function toggleNoteForm() {
            const card = document.getElementById('note-form-card');
            card.style.display = card.style.display === 'none' ? 'block' : 'none';
            if (card.style.display === 'none') resetNoteForm();
        }

        function resetNoteForm() {
            document.getElementById('note-edit-id').value = '';
            document.getElementById('note-title').value = '';
            document.getElementById('note-subject').value = '';
            document.getElementById('note-tags').value = '';
            document.getElementById('note-content').value = '';
            document.getElementById('note-form-title').innerText = '新增筆記';
        }

        function saveNote() {
            const title = document.getElementById('note-title').value.trim();
            const content = document.getElementById('note-content').value.trim();
            if (!title || !content) { alert('請填寫標題與內容！'); return; }

            const id = document.getElementById('note-edit-id').value;
            const noteData = {
                id: id || Date.now().toString(),
                title: title,
                subject: document.getElementById('note-subject').value.trim(),
                tags: document.getElementById('note-tags').value.trim(),
                content: content,
                createdAt: new Date().toLocaleDateString('zh-TW')
            };

            if (id) {
                const idx = notes.findIndex(n => n.id === id);
                notes[idx] = noteData;
            } else {
                notes.push(noteData);
            }

            saveData();
            toggleNoteForm();
            renderNotes();
        }

        function editNote(id) {
            const n = notes.find(n => n.id === id);
            if (!n) return;
            document.getElementById('note-edit-id').value = n.id;
            document.getElementById('note-title').value = n.title;
            document.getElementById('note-subject').value = n.subject;
            document.getElementById('note-tags').value = n.tags;
            document.getElementById('note-content').value = n.content;
            document.getElementById('note-form-title').innerText = '編輯筆記';
            document.getElementById('note-form-card').style.display = 'block';
        }

        function deleteNote(id) {
            if (confirm('確定要刪除這則筆記嗎？')) {
                notes = notes.filter(n => n.id !== id);
                saveData();
                renderNotes();
            }
        }

        function renderNotes() {
            const query = document.getElementById('note-search').value.toLowerCase();
            const filtered = notes.filter(n => 
                n.title.toLowerCase().includes(query) ||
                n.content.toLowerCase().includes(query) ||
                n.tags.toLowerCase().includes(query) ||
                n.subject.toLowerCase().includes(query)
            );

            const listEl = document.getElementById('notes-list');
            listEl.innerHTML = '';

            if (filtered.length === 0) {
                listEl.innerHTML = '<div class="empty-state" style="grid-column: 1/-1;">尚無相關筆記資料</div>';
                return;
            }

            filtered.forEach(n => {
                listEl.innerHTML += `
                    <div class="note-card">
                        <div>
                            <div class="note-title">[${n.subject || '一般'}] ${n.title}</div>
                            ${n.tags ? `<div class="note-tags"><i class="fa-solid fa-tag"></i> ${n.tags}</div>` : ''}
                            <div class="note-content">${n.content}</div>
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); pt-10; margin-top: 10px;">
                            <span style="font-size: 0.75rem; color: var(--text-sub);">${n.createdAt}</span>
                            <div>
                                <button class="btn btn-secondary" style="padding: 4px 8px;" onclick="editNote('${n.id}')"><i class="fa-solid fa-pen"></i></button>
                                <button class="btn btn-danger" style="padding: 4px 8px;" onclick="deleteNote('${n.id}')"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // --- 統計分析 ---
        function renderStats() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const rate = total > 0 ? Math.round((completed / total) * 100) : 0;

            document.getElementById('overall-progress').style.width = `${rate}%`;
            document.getElementById('overall-progress-text').innerText = `目前總任務完成率：${rate}% (${completed}/${total})`;

            const distEl = document.getElementById('subject-distribution');
            distEl.innerHTML = '';

            if (total === 0) {
                distEl.innerHTML = '<div class="empty-state">尚無任務資料進行統計</div>';
                return;
            }

            const subjectCounts = {};
            tasks.forEach(t => {
                const sub = t.subject || '一般/未分類';
                subjectCounts[sub] = (subjectCounts[sub] || 0) + 1;
            });

            for (const [sub, count] of Object.entries(subjectCounts)) {
                const subRate = Math.round((count / total) * 100);
                distEl.innerHTML += `
                    <div class="data-item">
                        <div class="item-main">
                            <strong>${sub}</strong>
                        </div>
                        <span>${count} 項任務 (${subRate}%)</span>
                    </div>
                `;
            }
        }

        // --- 重設資料機制 ---
        function confirmResetData() {
            if (confirm('警告：確定要將所有任務與筆記重設為預設範例資料嗎？')) {
                tasks = JSON.parse(JSON.stringify(sampleTasks));
                notes = JSON.parse(JSON.stringify(sampleNotes));
                saveData();
                alert('資料已成功重設！');
                location.reload();
            }
        }

        // --- 初始化 ---
        updateDashboard();
        updateSubjectFilters();
    </script>
</body>
</html>
